name: Ingest Census tracts + OZ 2.0 eligibility
on:
  # ACS 5-year publishes each December; this no-ops until a new vintage lands.
  schedule:
    - cron: '0 15 20 12 *'
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install psycopg2-binary requests openpyxl
      - env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_oz.py
