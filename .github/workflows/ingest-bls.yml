name: Ingest BLS (metro employment + unemployment + rent CPI + national real wages)
on:
  schedule:
    # Metro CES (State & Area) lands mid-to-late month, roughly three weeks
    # after the national print. A single monthly shot means that if BLS slips
    # past the 22nd, the metro read waits a FULL month. The 26th is a retry on
    # the same insert-if-changed logic, so it no-ops when the 22nd succeeded --
    # same belt-and-braces pattern already used for ZORI (16th + 23rd).
    - cron: '0 17 22 * *'   # monthly; CES metro release lands mid-to-late month
    - cron: '0 17 26 * *'   # retry, in case the release slipped past the 22nd
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install psycopg2-binary requests
      - env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_bls.py
