name: add-sources

# One-off: widen the feed registry. Idempotent — safe to re-run.
on:
  workflow_dispatch: {}

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install psycopg2-binary
      - name: Add sources
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python add_sources.py
