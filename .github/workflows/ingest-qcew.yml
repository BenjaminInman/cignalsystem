name: Ingest QCEW

# BLS QCEW publishes quarterly, ~5 months after quarter end. Run mid-month in
# the publication months (Mar/Jun/Sep/Dec) to catch the newest quarter, with a
# retry a week later in case it's late. Backfills the last 3 years each run.
on:
  # schedule moved to Vercel Cron (app/api/cron/dispatch) on 2026-10-15; GitHub's timer was unreliable.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install psycopg2-binary requests

      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_qcew.py

# Schedule re-registered 2026-10-14: scheduled runs had failed at startup since 2026-10-05.
