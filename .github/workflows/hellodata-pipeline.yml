name: HelloData pipeline

# fire  - queue Dataset Exports one MSA at a time (HelloData silently fails on
#         large pricing queries). drain - ingest what the webhook has queued.
# Decoupled: exports arrive asynchronously over hours.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "fire | drain | both"
        required: true
        default: "drain"
      fire_limit:
        description: "metros to fire (fire only)"
        required: false
        default: "25"
      fire_mode:
        description: "zip | metro | both (fire only)"
        required: false
        default: "both"
      fire_metros:
        description: "specific metro codes, comma-sep (bypasses pending)"
        required: false
        default: ""
      fire_segments:
        description: "segments mkt,aff,stu,sen (blank = all-in)"
        required: false
        default: ""
      drain_limit:
        description: "deliveries to ingest (drain only)"
        required: false
        default: "200"
  schedule:
    # Segmented NATIONAL backfill, running unattended until every metro has the
    # market-rate cut. Fire and drain alternate so deliveries clear between
    # fires and the 10-concurrent export cap is not saturated. Turn OFF (delete
    # the fire cron) once pending_metros_seg returns empty / national is done.
    - cron: "0,30 * * * *"    # segmented fire (mkt,aff,stu,sen), 3 metros/run
    - cron: "15,45 * * * *"   # drain sweep + integrity checks

concurrency:
  group: hellodata-pipeline
  cancel-in-progress: false

jobs:
  fire:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'fire' || github.event.inputs.job == 'both'))
      || (github.event_name == 'schedule' && github.event.schedule == '0,30 * * * *')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests psycopg2-binary
      - env:
          HELLODATA_API_KEY: ${{ secrets.HELLODATA_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HD_FIRE_LIMIT: ${{ github.event_name == 'schedule' && '3' || (github.event.inputs.fire_limit || '25') }}
          HD_FIRE_MODE: "both"
          HD_FIRE_METROS: ${{ github.event.inputs.fire_metros || '' }}
          HD_FIRE_SEGMENTS: ${{ github.event_name == 'schedule' && 'mkt,aff,stu,sen' || (github.event.inputs.fire_segments || '') }}
        run: python fire_hellodata.py

  drain:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15,45 * * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'drain' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests psycopg2-binary
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HD_DRAIN_LIMIT: ${{ github.event.inputs.drain_limit || '200' }}
        run: python drain_hellodata.py
      - name: integrity checks
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python check_integrity.py
