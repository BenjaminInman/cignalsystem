name: HelloData pipeline

# fire  - a LONG-RUNNING loop that keeps HelloData's 10-concurrent export cap
#         saturated until every metro has segment data (or the time budget is
#         spent). One continuous job instead of many flaky cron runs - this is
#         what avoids the start/stop churn of the first backfill.
# drain - ingest whatever the webhook has queued, every 15 min, refreshing the
#         analytics view each pass. Runs in PARALLEL with fire (separate
#         concurrency groups): fire only posts export jobs and touches hd_fired;
#         drain ingests into observations - they do not collide.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "fire | drain | both | chunk | coverage"
        required: true
        default: "drain"
      chunk_segment:
        description: "segment for chunk job: mkt|aff|stu|sen (chunk only)"
        required: false
        default: "mkt"
      chunk_metros:
        description: "explicit metro codes for chunk job (blank = auto-missing)"
        required: false
        default: ""
      fire_limit:
        description: "pending batch size (fire only)"
        required: false
        default: "25"
      fire_mode:
        description: "zip | metro | both (fire only)"
        required: false
        default: "both"
      fire_metros:
        description: "specific metro codes, comma-sep (bypasses pending)"
        required: false
        default: ""
      fire_segments:
        description: "segments mkt,aff,stu,sen (blank = all-in)"
        required: false
        default: ""
      fire_loop:
        description: "1 = continuous loop, 0 = single pass (fire only)"
        required: false
        default: "0"
      drain_limit:
        description: "deliveries to ingest (drain only)"
        required: false
        default: "300"
  schedule:
    # Segmented NATIONAL backfill. The fire loop runs ~5.8h each start; a fresh
    # start every 6h makes it effectively continuous. Drain sweeps every 15 min.
    # When national is done pending_metros_seg returns empty and the loop exits
    # immediately each cycle (harmless) - delete these crons to switch it off.
    - cron: "0 */6 * * *"     # start the segmented fire loop
    - cron: "*/15 * * * *"    # drain + view refresh

jobs:
  fire:
    if: >-
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'fire' || github.event.inputs.job == 'both'))
      || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: hellodata-fire
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests psycopg2-binary
      - env:
          HELLODATA_API_KEY: ${{ secrets.HELLODATA_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HD_FIRE_LIMIT: ${{ github.event.inputs.fire_limit || '25' }}
          HD_FIRE_MODE: "both"
          HD_FIRE_METROS: ${{ github.event.inputs.fire_metros || '' }}
          HD_FIRE_SEGMENTS: ${{ github.event_name == 'schedule' && 'mkt,aff,stu,sen' || (github.event.inputs.fire_segments || '') }}
          HD_FIRE_LOOP: ${{ github.event_name == 'schedule' && '1' || (github.event.inputs.fire_loop || '0') }}
          HD_FIRE_MINUTES: "348"
        run: python fire_hellodata.py

  chunk:
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'chunk'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: hellodata-fire
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests psycopg2-binary
      - env:
          HELLODATA_API_KEY: ${{ secrets.HELLODATA_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HD_CHUNK_SEGMENT: ${{ github.event.inputs.chunk_segment || 'mkt' }}
          HD_CHUNK_METROS: ${{ github.event.inputs.chunk_metros || '' }}
          HD_CHUNK: "60"
        run: python fire_hellodata_chunked.py

  coverage:
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: hellodata-fire
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          HELLODATA_API_KEY: ${{ secrets.HELLODATA_API_KEY }}
        run: python fire_coverage_seg.py

  drain:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'drain' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hellodata-drain
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests psycopg2-binary
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HD_DRAIN_LIMIT: ${{ github.event.inputs.drain_limit || '300' }}
        run: python drain_hellodata.py
      - name: integrity checks
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python check_integrity.py
