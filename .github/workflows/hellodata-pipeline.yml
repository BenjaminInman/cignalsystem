name: HelloData pipeline

# Two jobs, run independently:
#   fire  - queue Dataset Exports, one MSA at a time (HelloData silently fails
#           on anything larger; see fire_hellodata.py for the measurements)
#   drain - ingest whatever the webhook has queued in hd_deliveries
#
# They are deliberately decoupled: exports arrive asynchronously over hours, so
# firing and ingesting must not block on each other.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "fire | drain | both"
        required: true
        default: "drain"
      fire_limit:
        description: "metros to fire (fire only)"
        required: false
        default: "25"
      fire_mode:
        description: "zip | metro | both (fire only)"
        required: false
        default: "both"
      drain_limit:
        description: "deliveries to ingest (drain only)"
        required: false
        default: "50"
  schedule:
    # Every 15 min. HelloData's cap is 10 CONCURRENT exports, not 10 per period,
    # and each takes ~3-8 min, so the real ceiling is ~80-120/hour. Firing 5
    # metros (10 exports) per quarter hour sits right at the cap.
    - cron: "*/15 * * * *"

# Only one run at a time. Two drains overlapping would collide on
# REFRESH MATERIALIZED VIEW CONCURRENTLY (which serialises anyway) and pile up
# queued runs. Waiting rather than cancelling means no delivery is skipped.
concurrency:
  group: hellodata-pipeline
  cancel-in-progress: false

jobs:
  # Fires a SMALL batch every 30 minutes. HelloData caps concurrent exports at
  # 10, so a big one-shot run mostly 429s. Small paced batches let the national
  # backfill complete unattended over a day or so.
  fire:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'fire' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests psycopg2-binary
      - env:
          HELLODATA_API_KEY: ${{ secrets.HELLODATA_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HD_FIRE_LIMIT: ${{ github.event.inputs.fire_limit || '20' }}
          HD_FIRE_MODE: ${{ github.event.inputs.fire_mode || 'both' }}
        run: python fire_hellodata.py

  drain:
    if: github.event_name == 'schedule' || github.event.inputs.job == 'drain' || github.event.inputs.job == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pandas requests psycopg2-binary
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HD_DRAIN_LIMIT: ${{ github.event.inputs.drain_limit || '200' }}
        run: python drain_hellodata.py
      # Invariant checks run after every drain. These are STATE invariants, not
      # code errors - a build passes while the warehouse quietly drifts - so they
      # have to run against the live DB. Failing the job is the point.
      - name: integrity checks
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python check_integrity.py
