name: Ingest FRED

# Runs itself daily — FRED's fast series (treasury, mortgage) stay current;
# slow series (CPI, starts, vacancy) simply no-op on days they haven't updated.
on:
  schedule:
    - cron: "0 12 * * *"   # daily, 12:00 UTC
  workflow_dispatch: {}    # manual trigger from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install psycopg2-binary requests
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python ingest_fred.py
