name: Ingest FRED

# Runs itself daily — FRED's fast series (treasury, mortgage) stay current;
# slow series (CPI, starts, vacancy) simply no-op on days they haven't updated.
on:
  schedule:
    - cron: "0 12 * * *"   # daily, 12:00 UTC
  workflow_dispatch: {}    # manual trigger from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install psycopg2-binary requests
      # Idempotent no-op once the rows exist. Lives here so the labor-slack
      # indicators register themselves on the next successful run rather than
      # waiting on a manual dispatch — the one-off workflow was dispatched into
      # the 2026-08-06 Actions outage and never got a runner. Registration must
      # precede ingestion in the same run: ingest_fred.py selects its work by
      # source='FRED', so a row that appears after the SELECT waits a full day.
      # Safe to delete once the four rows are confirmed in the catalog.
      - name: Register labor indicators (idempotent)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python register_labor_indicators.py
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python ingest_fred.py
