name: Ingest Census PEP (metro migration)

# Annual. The Census metro/county components-of-change file for vintage V lands
# each March (Vintage 2025 published March 2026), so run late March with an
# April retry. The script walks back vintages until one is reachable, so a late
# release degrades to "no new data" rather than a failure.
on:
  # schedule moved to Vercel Cron (app/api/cron/dispatch) on 2026-10-15; GitHub's timer was unreliable.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install psycopg2-binary
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_pep.py

# Schedule re-registered 2026-10-14: scheduled runs had failed at startup since 2026-10-05.
