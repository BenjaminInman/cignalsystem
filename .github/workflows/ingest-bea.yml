name: Ingest BEA (Regional Price Parities)
on:
  schedule:
    - cron: '0 16 12 * *'   # monthly; no-ops until BEA's annual (≈Dec) RPP refresh + revisions
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install psycopg2-binary requests
      - env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_bea.py
