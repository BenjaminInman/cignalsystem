name: compose-news

# Turns extracted facts into gated article drafts. Runs 30 minutes after
# ingest-news so the day's facts are already in the table. Nothing publishes:
# every draft lands with status='draft' and its gate result attached.
on:
  schedule:
    - cron: "30 11 * * *"   # 11:30 UTC daily, after ingest-news at 11:00
  workflow_dispatch: {}     # manual trigger for testing

concurrency:
  group: compose-news
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests psycopg2-binary

      - name: Compose drafts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python compose_news.py
