name: Ingest GSE (Fannie/Freddie multifamily)

# Monthly — parses Fannie's Monthly Summary and Freddie's Monthly Volume Summary
# for multifamily serious delinquency rates. Public GSE filings, no API key.
# Runs mid-month (filings for the prior month post early-to-mid month) with a
# late-month retry.
on:
  # schedule moved to Vercel Cron (app/api/cron/dispatch) on 2026-10-15; GitHub's timer was unreliable.
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install psycopg2-binary pdfplumber
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_gse.py

# Schedule re-registered 2026-10-14: scheduled runs had failed at startup since 2026-10-05.
