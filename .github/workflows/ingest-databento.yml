name: Ingest Databento (equity EOD)

# Runs each morning BEFORE the US business day — pulls consolidated EOD closes
# for the /indices donuts from Databento EQUS.SUMMARY and upserts equity_quotes.
#
# Why morning, not after the close: EQUS.SUMMARY's consolidated session isn't
# published yet ~90 min after the bell, so an evening run picks up the PRIOR
# session and the tab reads two sessions stale all the next day. Running at
# 11:00 UTC (~6-7am ET) gives Databento overnight to publish, so each business
# day shows the previous session's close (Wed shows Tue, Tue shows Mon).
#
# Runs every day, not just weekdays: a Mon-Fri schedule never loads Friday's
# close until Monday morning. The Saturday run picks it up; Sunday no-ops.
# The script clamps to Databento's available range, so extra runs are
# idempotent — they just re-write the last available session.
#
# Two runs a day: a 2026-07-15 16:02 UTC test confirmed the prior session (Jul 14)
# was published by midday, but not that it's up by 11:00 UTC. The 14:00 UTC run is
# a safety net so the tab is fresh before the US business day is underway. If the
# 11:00 run proves sufficient, the second can be dropped.
on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC (~6-7am ET), every day
    - cron: "0 14 * * *"   # 14:00 UTC (~9-10am ET) safety net — see note
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install psycopg2-binary databento
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python ingest_databento.py
