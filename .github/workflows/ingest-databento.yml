name: Ingest Databento (equity EOD)

# Daily after US market close — pulls consolidated EOD closes for the /indices
# donuts from Databento EQUS.SUMMARY and upserts equity_quotes. Weekends/holidays
# simply re-write the last session's closes (idempotent).
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC (~4:30pm ET), weekdays
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install psycopg2-binary databento
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
        run: python ingest_databento.py
