name: Ingest ZHVI

on:
  schedule:
    - cron: "0 14 16 * *"   # ZHVI updates monthly; run mid-month
    - cron: "0 14 23 * *"   # retry a week later if late
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pandas psycopg2-binary requests
      - name: Run ingestion
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_zhvi.py
