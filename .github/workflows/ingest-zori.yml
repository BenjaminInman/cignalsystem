name: Ingest ZORI

# Runs itself — no manual download/upload, ever.
on:
  schedule:
    # ZORI CSVs update monthly. Run mid-month (16th, 13:00 UTC) to catch the
    # new release, plus a retry a week later in case it's late.
    - cron: "0 13 16 * *"
    - cron: "0 13 23 * *"
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas psycopg2-binary requests

      - name: Run ingestion
        env:
          # Add this in repo Settings -> Secrets and variables -> Actions
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_zori.py
