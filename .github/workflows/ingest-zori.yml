name: Ingest ZORI

# Runs itself — no manual download/upload, ever.
on:
  # schedule moved to Vercel Cron (app/api/cron/dispatch) on 2026-10-15; GitHub's timer was unreliable.
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pandas psycopg2-binary requests

      - name: Run ingestion
        env:
          # Add this in repo Settings -> Secrets and variables -> Actions
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_zori.py

# Schedule re-registered 2026-10-14: scheduled runs had failed at startup since 2026-10-05.
