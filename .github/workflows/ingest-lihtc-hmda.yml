name: Ingest LIHTC designations + HMDA
on:
  # HUD publishes QCT/DDA each autumn (effective Jan 1); HMDA lands each spring.
  # Two runs a year covers both; no-ops when nothing changed.
  # schedule moved to Vercel Cron (app/api/cron/dispatch) on 2026-10-15; GitHub's timer was unreliable.
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install psycopg2-binary requests openpyxl
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_lihtc_hmda.py

# Schedule re-registered 2026-10-14: scheduled runs had failed at startup since 2026-10-05.
