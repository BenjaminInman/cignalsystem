name: Ingest Census SOMA (absorption)
on:
  schedule:
    # ~a week after each quarterly SOMA release (first week of Mar/Jun/Sep/Dec);
    # no-ops until a new completion quarter appears.
    - cron: '0 14 12 3,6,9,12 *'
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install psycopg2-binary requests
      - env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_soma.py
