name: Ingest metro industry employment (BLS CES)
on:
  # BLS publishes metro CES around the third week of each month.
  schedule:
    - cron: '0 16 22 * *'
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install psycopg2-binary requests
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest_metro_industries.py
